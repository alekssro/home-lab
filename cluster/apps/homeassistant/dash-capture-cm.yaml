apiVersion: v1
kind: ConfigMap
metadata:
  name: dash-capture-config
  namespace: homeassistant
data:
  capture.js: |
    const http = require('http');
    const puppeteer = require('puppeteer');
    const fs = require('fs');
    const path = require('path');

    const PORT = parseInt(process.env.PORT || '8099', 10);
    const OUTPUT_FILE = process.env.OUTPUT_FILE || '/config/www/dashboard_epaper.png';
    const TARGET_URL = process.env.TARGET_URL || 'http://127.0.0.1:8123/lovelace-epaper/0?kiosk';
    const WIDTH = parseInt(process.env.VIEWPORT_WIDTH || '800', 10);
    const HEIGHT = parseInt(process.env.VIEWPORT_HEIGHT || '480', 10);
    const DELAY = parseInt(process.env.RENDER_DELAY || '3000', 10);
    const USER_DATA_DIR = process.env.USER_DATA_DIR || '/tmp/puppeteer_profile';

    let isCapturing = false;

    async function capture() {
      if (isCapturing) {
        console.log('Capture already in progress, skipping duplicate call.');
        return;
      }
      isCapturing = true;
      console.log('[' + new Date().toISOString() + '] Starting capture of ' + TARGET_URL + '...');
      let browser;
      try {
        browser = await puppeteer.launch({
          executablePath: '/usr/bin/chromium-browser',
          userDataDir: USER_DATA_DIR,
          args: [
            '--no-sandbox',
            '--disable-setuid-sandbox',
            '--disable-dev-shm-usage',
            '--disable-gpu',
            '--no-first-run',
            '--no-zygote'
          ]
        });
        const page = await browser.newPage();
        await page.setViewport({ width: WIDTH, height: HEIGHT });

        await page.goto(TARGET_URL, { waitUntil: 'networkidle2', timeout: 35000 }).catch(function(e) {
          console.warn('Initial goto warning:', e.message);
        });

        // Check if redirected to an authentication/login page
        if (page.url().indexOf('/auth/') !== -1) {
          console.log('Detected auth page (' + page.url() + '), attempting user selection...');
          await new Promise(function(r) { setTimeout(r, 2000); });
          var clicked = await page.evaluate(function() {
            var elements = Array.from(document.querySelectorAll('*'));
            for (var i = 0; i < elements.length; i++) {
              var el = elements[i];
              var txt = (el.textContent || '').trim();
              if ((txt === 'Alejandro' || txt.indexOf('Alejandro') !== -1) && el.children.length === 0) {
                el.click();
                return true;
              }
            }
            return false;
          });
          if (clicked) {
            console.log('Clicked Alejandro user button, waiting for redirect...');
            await page.waitForNavigation({ waitUntil: 'networkidle2', timeout: 15000 }).catch(function() {});
          }
        }

        // Wait for Lovelace UI view container to render
        await page.waitForSelector('ha-panel-lovelace, hui-view, home-assistant', { timeout: 15000 }).catch(function(e) {
          console.warn('Lovelace selector wait warning:', e.message);
        });

        if (DELAY > 0) {
          await new Promise(function(r) { setTimeout(r, DELAY); });
        }

        var dir = path.dirname(OUTPUT_FILE);
        if (!fs.existsSync(dir)) {
          fs.mkdirSync(dir, { recursive: true });
        }

        await page.screenshot({ path: OUTPUT_FILE, type: 'png' });
        console.log('[' + new Date().toISOString() + '] Screenshot successfully saved to ' + OUTPUT_FILE);
      } catch (err) {
        console.error('Error in capture():', err);
        throw err;
      } finally {
        if (browser) {
          await browser.close().catch(function() {});
        }
        isCapturing = false;
      }
    }

    // Initial capture on startup after short delay
    setTimeout(function() {
      capture().catch(function(err) { console.error('Initial startup capture failed:', err.message); });
    }, 15000);

    // Scheduled interval capture (default: every 10 minutes = 600000ms)
    var INTERVAL_MS = parseInt(process.env.INTERVAL_MS || '600000', 10);
    if (INTERVAL_MS > 0) {
      setInterval(function() {
        capture().catch(function(err) { console.error('Periodic capture failed:', err.message); });
      }, INTERVAL_MS);
    }

    // HTTP Server
    var server = http.createServer(async function(req, res) {
      if (req.url === '/capture' || req.url === '/capture/') {
        try {
          await capture();
          res.writeHead(200, { 'Content-Type': 'application/json' });
          res.end(JSON.stringify({ status: 'ok', file: OUTPUT_FILE, timestamp: new Date().toISOString() }));
        } catch (err) {
          res.writeHead(500, { 'Content-Type': 'application/json' });
          res.end(JSON.stringify({ status: 'error', message: err.message }));
        }
      } else if (req.url === '/health' || req.url === '/healthz') {
        res.writeHead(200, { 'Content-Type': 'text/plain' });
        res.end('OK');
      } else {
        res.writeHead(404, { 'Content-Type': 'text/plain' });
        res.end('Not Found');
      }
    });

    server.listen(PORT, '0.0.0.0', function() {
      console.log('dash-capture listening on port ' + PORT);
    });
