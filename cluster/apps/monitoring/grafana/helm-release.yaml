---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: monitoring
spec:
  interval: 5m
  chart:
    spec:
      chart: grafana
      version: 10.5.15
      sourceRef:
        kind: HelmRepository
        name: grafana-charts
        namespace: flux-system
      interval: 5m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    adminPassword: admin
    deploymentStrategy:
      type: Recreate
    podAnnotations:
      secret.reloader.stakater.com/reload: "grafana-secrets"
    envValueFrom:
      GF_SMTP_USER:
        secretKeyRef:
          name: grafana-secrets
          key: SMTP_USERNAME
      GF_SMTP_PASSWORD:
        secretKeyRef:
          name: grafana-secrets
          key: SMTP_PASSWORD
    grafana.ini:
      server:
        root_url: "https://grafana.${SECRET_DOMAIN}"
      smtp:
        enabled: true
        host: protonmail-bridge.mail.svc.cluster.local:25
        from_address: lab@alekssro.com
        from_name: Grafana HomeLab
        startTLS_policy: OpportunisticStartTLS
        skip_verify: true
    ingress:
      enabled: true
      ingressClassName: traefik
      annotations:
        cert-manager.io/cluster-issuer: "letsencrypt-production"
        traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
        traefik.ingress.kubernetes.io/router.middlewares: "networking-internal-only@kubernetescrd"
      hosts:
        - "grafana.${SECRET_DOMAIN}"
      tls:
        - secretName: grafana-tls
          hosts:
            - "grafana.${SECRET_DOMAIN}"
    persistence:
      enabled: true
      type: pvc
      existingClaim: grafana-pvc
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: prometheus
            type: prometheus
            access: proxy
            url: http://prometheus-service.monitoring.svc.cluster.local:9090
            isDefault: true
            uid: prometheus
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: 'default'
            orgId: 1
            folder: ''
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/default
    dashboards:
      default:
        host-os:
          gnetId: 1860
          revision: 1
          datasource: prometheus
        host-os-2:
          gnetId: 13702
          revision: 1
          datasource: prometheus
        containers:
          gnetId: 13946
          revision: 1
          datasource: prometheus
        nvidia-gpu:
          gnetId: 14574
          revision: 1
          datasource: prometheus
    alerting:
      rules.yaml:
        apiVersion: 1
        groups:
          - orgId: 1
            name: 'HomeLab Alerts'
            folder: 'HomeLab'
            interval: 1m
            rules:
              - uid: 'target-down'
                title: 'Infrastructure Target Down'
                condition: 'C'
                data:
                  - refId: 'A'
                    relativeTimeRange:
                      from: 300
                      to: 0
                    datasourceUid: 'prometheus'
                    model:
                      expr: 'up == 0'
                      intervalMs: 15000
                      maxDataPoints: 43200
                      refId: 'A'
                  - refId: 'B'
                    relativeTimeRange:
                      from: 300
                      to: 0
                    datasourceUid: '__expr__'
                    model:
                      expression: 'A'
                      reducer: 'last'
                      type: 'reduce'
                      refId: 'B'
                  - refId: 'C'
                    relativeTimeRange:
                      from: 300
                      to: 0
                    datasourceUid: '__expr__'
                    model:
                      expression: '$B > 0'
                      type: 'math'
                      refId: 'C'
                for: '3m'
                annotations:
                  summary: 'Target {{ "{{" }} $labels.instance {{ "}}" }} (job: {{ "{{" }} $labels.job {{ "}}" }}) is unreachable'
                labels:
                  severity: 'critical'
              - uid: 'container-memory-near-limit'
                title: 'Container Nearing Memory Limit'
                condition: 'C'
                data:
                  - refId: 'A'
                    relativeTimeRange:
                      from: 300
                      to: 0
                    datasourceUid: 'prometheus'
                    model:
                      expr: '(container_memory_working_set_bytes{container!="", container!="POD"} / (container_spec_memory_limit_bytes{container!="", container!="POD"} > 0 < 100000000000)) * 100'
                      intervalMs: 15000
                      maxDataPoints: 43200
                      refId: 'A'
                  - refId: 'B'
                    relativeTimeRange:
                      from: 300
                      to: 0
                    datasourceUid: '__expr__'
                    model:
                      expression: 'A'
                      reducer: 'last'
                      type: 'reduce'
                      refId: 'B'
                  - refId: 'C'
                    relativeTimeRange:
                      from: 300
                      to: 0
                    datasourceUid: '__expr__'
                    model:
                      expression: '$B > 88'
                      type: 'math'
                      refId: 'C'
                for: '5m'
                annotations:
                  summary: 'Container {{ "{{" }} $labels.container {{ "}}" }} in pod {{ "{{" }} $labels.pod {{ "}}" }} is exceeding 88% of memory limit'
                labels:
                  severity: 'warning'
              - uid: 'node-memory-high'
                title: 'Node Memory Usage High'
                condition: 'C'
                data:
                  - refId: 'A'
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: 'prometheus'
                    model:
                      expr: '(sum(container_memory_working_set_bytes{container!=""}) by (instance) / on(instance) machine_memory_bytes) * 100'
                      intervalMs: 15000
                      maxDataPoints: 43200
                      refId: 'A'
                  - refId: 'B'
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: '__expr__'
                    model:
                      expression: 'A'
                      reducer: 'last'
                      type: 'reduce'
                      refId: 'B'
                  - refId: 'C'
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: '__expr__'
                    model:
                      expression: '$B > 88'
                      type: 'math'
                      refId: 'C'
                for: '10m'
                annotations:
                  summary: 'Node {{ "{{" }} $labels.instance {{ "}}" }} memory usage is sustained above 88%'
                labels:
                  severity: 'warning'
              - uid: 'node-cpu-sustained-high'
                title: 'Node Sustained High CPU'
                condition: 'C'
                data:
                  - refId: 'A'
                    relativeTimeRange:
                      from: 900
                      to: 0
                    datasourceUid: 'prometheus'
                    model:
                      expr: '(sum(rate(container_cpu_usage_seconds_total{container!=""}[5m])) by (instance) / on(instance) machine_cpu_cores) * 100'
                      intervalMs: 15000
                      maxDataPoints: 43200
                      refId: 'A'
                  - refId: 'B'
                    relativeTimeRange:
                      from: 900
                      to: 0
                    datasourceUid: '__expr__'
                    model:
                      expression: 'A'
                      reducer: 'last'
                      type: 'reduce'
                      refId: 'B'
                  - refId: 'C'
                    relativeTimeRange:
                      from: 900
                      to: 0
                    datasourceUid: '__expr__'
                    model:
                      expression: '$B > 90'
                      type: 'math'
                      refId: 'C'
                for: '15m'
                annotations:
                  summary: 'Node {{ "{{" }} $labels.instance {{ "}}" }} CPU is sustained above 90% for >15m'
                labels:
                  severity: 'warning'
              - uid: 'node-disk-space-low'
                title: 'Node Root Disk Space Low'
                condition: 'C'
                data:
                  - refId: 'A'
                    relativeTimeRange:
                      from: 900
                      to: 0
                    datasourceUid: 'prometheus'
                    model:
                      expr: '(container_fs_usage_bytes{id="/"} / container_fs_limit_bytes{id="/"}) * 100'
                      intervalMs: 30000
                      maxDataPoints: 43200
                      refId: 'A'
                  - refId: 'B'
                    relativeTimeRange:
                      from: 900
                      to: 0
                    datasourceUid: '__expr__'
                    model:
                      expression: 'A'
                      reducer: 'last'
                      type: 'reduce'
                      refId: 'B'
                  - refId: 'C'
                    relativeTimeRange:
                      from: 900
                      to: 0
                    datasourceUid: '__expr__'
                    model:
                      expression: '$B > 85'
                      type: 'math'
                      refId: 'C'
                for: '15m'
                annotations:
                  summary: 'Node {{ "{{" }} $labels.instance {{ "}}" }} root filesystem is above 85% full'
                labels:
                  severity: 'warning'
      contactpoints.yaml:
        apiVersion: 1
        contactPoints:
          - orgId: 1
            name: email-admin
            receivers:
              - uid: email-admin-receiver
                type: email
                disableResolveMessage: false
                settings:
                  addresses: lab+grafana@alekssro.com
                  singleEmail: true
      policies.yaml:
        apiVersion: 1
        policies:
          - orgId: 1
            receiver: email-admin
            group_by:
              - grafana_folder
              - alertname
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 4h
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 256Mi
