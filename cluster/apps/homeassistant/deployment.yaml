---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homeassistant
  namespace: homeassistant
  labels:
    app: homeassistant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: homeassistant
  template:
    metadata:
      annotations:
        configmap.reloader.stakater.com/reload: homeassistant-config,dash-capture-config
        secret.reloader.stakater.com/reload: home-assistant-secret
      labels:
        app: homeassistant
    spec:
      hostNetwork: true
      containers:
        - image: ghcr.io/home-assistant/home-assistant:2026.10.3
          name: home-assistant
          env:
            - name: TZ
              value: "Europe/Madrid"
            - name: DBUS_SYSTEM_BUS_ADDRESS
              value: unix:path=/var/run/dbus/system_bus_socket
          securityContext:
            privileged: true
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
                - SYS_ADMIN
          resources:
            requests:
              cpu: 250m
              memory: 1500Mi
            limits:
              memory: 2300Mi
          volumeMounts:
            - mountPath: "/config"
              name: home-assistant-pvc
            - mountPath: "/config/configuration.yaml"
              name: home-assistant-config
              subPath: configuration.yaml
            - mountPath: "/config/templates.yaml"
              name: home-assistant-config
              subPath: templates.yaml
            - mountPath: "/etc/resolv.conf"
              name: home-assistant-config
              subPath: resolv.conf
            - mountPath: "/config/SERVICE_ACCOUNT.JSON"
              name: home-assistant-secret
              subPath: SERVICE_ACCOUNT.JSON
            - mountPath: "/var/run/dbus"
              name: dbus
        - name: dash-capture
          image: zenika/alpine-chrome:with-puppeteer
          workingDir: /usr/src/app
          command: ["node", "/usr/src/app/capture.js"]
          env:
            - name: TZ
              value: "Europe/Madrid"
            - name: NODE_PATH
              value: "/usr/src/app/node_modules"
            - name: TARGET_URL
              value: "http://127.0.0.1:8123/lovelace-epaper/0?kiosk"
            - name: OUTPUT_FILE
              value: "/config/www/dashboard_epaper.png"
            - name: VIEWPORT_WIDTH
              value: "800"
            - name: VIEWPORT_HEIGHT
              value: "480"
            - name: RENDER_DELAY
              value: "3000"
            - name: INTERVAL_MS
              value: "600000"
            - name: PORT
              value: "8099"
          securityContext:
            runAsUser: 0
            capabilities:
              add:
                - SYS_ADMIN
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 768Mi
          volumeMounts:
            - mountPath: "/config"
              name: home-assistant-pvc
            - mountPath: "/usr/src/app/capture.js"
              name: dash-capture-script
              subPath: capture.js
      nodeSelector:
        kubernetes.io/hostname: nuc7pjyhn-rookie
      volumes:
        - name: home-assistant-config
          configMap:
            name: homeassistant-config
        - name: dash-capture-script
          configMap:
            name: dash-capture-config
        - name: home-assistant-secret
          secret:
            secretName: home-assistant-secret
        - name: home-assistant-pvc
          persistentVolumeClaim:
            claimName: home-assistant-pvc
        - name: dbus
          hostPath:
            path: "/var/run/dbus"
