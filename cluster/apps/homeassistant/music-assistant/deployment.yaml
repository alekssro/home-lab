---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: music-assistant
  namespace: homeassistant
  labels:
    app: music-assistant
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: music-assistant
  template:
    metadata:
      labels:
        app: music-assistant
    spec:
      hostNetwork: true
      containers:
        - image: brainicism/bgutil-ytdlp-pot-provider:1.3.2
          name: bgutil-ytdlp-pot-provider
          env:
            - name: TZ
              value: "Europe/Madrid"
          securityContext:
            privileged: true
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
                - SYS_ADMIN
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              memory: 192Mi
          volumeMounts:
            - mountPath: "/data"
              name: music-assistant-pvc
        - image: ghcr.io/music-assistant/server:2.10.9
          name: music-assistant
          env:
            - name: TZ
              value: "Europe/Madrid"
          securityContext:
            privileged: true
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
                - SYS_ADMIN
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 320Mi
          volumeMounts:
            - mountPath: "/data"
              name: music-assistant-pvc
      nodeSelector:
        kubernetes.io/hostname: nuc7pjyhn-cripple
      volumes:
        - name: music-assistant-pvc
          persistentVolumeClaim:
            claimName: music-assistant-pvc
