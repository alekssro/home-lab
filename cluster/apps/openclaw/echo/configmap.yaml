---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-echo-config
  namespace: openclaw
  labels:
    app: openclaw-echo
data:
  openclaw.json: |
    {
      "gateway": {
        "mode": "local",
        "bind": "lan",
        "trustedProxies": ["10.42.0.0/16", "10.43.0.0/16"],
        "port": 18789,
        "auth": {
          "mode": "token"
        },
        "controlUi": {
          "enabled": true,
          "allowedOrigins": ["https://openclaw.${SECRET_DOMAIN}"]
        }
      },
      "browser": {
        "enabled": true,
        "headless": true,
        "noSandbox": true
      },
      "channels": {
        "telegram": {
          "enabled": true,
          "botToken": "$${TELEGRAM_BOT_TOKEN}",
          "dmPolicy": "pairing"
        }
      },
      "models": {
        "providers": {
          "ollama": {
            "baseUrl": "http://ollama:11434",
            "api": "ollama",
            "timeoutSeconds": 300,
            "models": [
              {
                "id": "gemma4:12b",
                "name": "gemma4:12b",
                "reasoning": true,
                "input": ["text", "image"],
                "contextWindow": 65536,
                "maxTokens": 16384,
                "cost": { "input": 0, "output": 0, "cacheRead": 0, "cacheWrite": 0 },
                "params": {
                  "num_ctx": 65536
                }
              },
              {
                "id": "qwen3.5:9B",
                "name": "qwen3.5:9B",
                "reasoning": true,
                "input": ["text", "image"],
                "contextWindow": 32768,
                "maxTokens": 8192,
                "cost": { "input": 0, "output": 0, "cacheRead": 0, "cacheWrite": 0 },
                "params": {
                  "num_ctx": 32768
                }
              },
              {
                "id": "mistral-nemo:latest",
                "name": "mistral-nemo:latest",
                "reasoning": false,
                "input": ["text"],
                "contextWindow": 65536,
                "maxTokens": 8192,
                "cost": { "input": 0, "output": 0, "cacheRead": 0, "cacheWrite": 0 }
              }
            ]
          }
        }
      },
      "agents": {
        "defaults": {
          "workspace": "~/.openclaw/workspace",
          "heartbeat": {
            "every": "0m"
          },
          "model": {
            "primary": "ollama/gemma4:12b"
          },
          "thinkingDefault": "medium",
          "reasoningDefault": "on",
          "compaction": {
            "reserveTokens": 4096,
            "reserveTokensFloor": 0
          }
        },
        "entries": {
          "echo": {
            "name": "Echo",
            "workspace": "~/.openclaw/workspace",
            "model": {
              "primary": "ollama/gemma4:12b"
            }
          }
        }
      },
      "cron": { "enabled": false },
      "mcp": {
        "servers": {
          "superlist": {
            "url": "https://app.superlist.com/mcp",
            "transport": "streamable-http",
            "auth": "oauth",
            "enabled": true,
            "connectionTimeoutMs": 5000,
            "requestTimeoutMs": 20000
          }
        }
      }
    }
