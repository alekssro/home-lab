---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: open-webui
spec:
  replicas: 0
  strategy:
    # Open WebUI keeps its database (SQLite) on the shared RWX NFS volume.
    # A rolling update would briefly run two pods against the same file, so
    # the old pod has to go away first.
    type: Recreate
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
      annotations:
        secret.reloader.stakater.com/reload: "open-webui-secret"
        configmap.reloader.stakater.com/reload: "open-webui-config"
    spec:
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:0.12.3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: open-webui-config
            - secretRef:
                name: open-webui-secret
          # First boot pulls embedding models and runs database migrations,
          # which can take several minutes. The startup probe keeps the
          # liveness probe from killing the pod while that is happening.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "1Gi"
            limits:
              memory: "2Gi"
          volumeMounts:
            - name: appdata
              mountPath: /app/backend/data
      volumes:
        - name: appdata
          persistentVolumeClaim:
            claimName: open-webui-appdata
