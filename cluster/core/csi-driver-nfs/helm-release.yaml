apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: csi-driver-nfs
  namespace: kube-system
spec:
  interval: 5m
  chart:
    spec:
      chart: csi-driver-nfs
      version: 4.13.4
      sourceRef:
        kind: HelmRepository
        name: csi-driver-nfs
        namespace: flux-system
  values:
    controller:
      replicas: 2
      enableSnapshotter: false
      resources:
        csiProvisioner:
          requests:
            cpu: 10m
            memory: 24Mi
          limits:
            memory: 128Mi
        csiResizer:
          requests:
            cpu: 10m
            memory: 24Mi
          limits:
            memory: 128Mi
        livenessProbe:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi
        nfs:
          requests:
            cpu: 10m
            memory: 24Mi
          limits:
            memory: 128Mi
    node:
      resources:
        livenessProbe:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi
        nodeDriverRegistrar:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi
        nfs:
          requests:
            cpu: 10m
            memory: 24Mi
          limits:
            memory: 128Mi
